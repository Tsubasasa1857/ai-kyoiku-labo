<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI共育ラボ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
      background: #1E3A5F;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .profile {
      text-align: center;
      margin-bottom: 32px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #F5A623;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 16px;
    }

    .profile h1 {
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .profile p {
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      line-height: 1.6;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 16px 20px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }

    .link-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-1px);
    }

    .link-btn.primary {
      background: #F5A623;
      border-color: #F5A623;
      color: #1E3A5F;
      font-weight: bold;
    }

    .link-btn.primary:hover {
      background: #e09518;
    }

    .icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .label {
      flex: 1;
    }

    .arrow {
      font-size: 12px;
      opacity: 0.6;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: rgba(255,255,255,0.3);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile">
      <div class="avatar">🧠</div>
      <h1>AI共育ラボ</h1>
      <p>AIと「共に考える」力を育てる教室<br>宿題を"終わらせる"AIから、"学ぶ"AIへ。</p>
    </div>

    <div class="links">
      <!-- ① 無料体験 -->
      <a href="https://tally.so/r/yPy1DB" class="link-btn primary">
        <span class="icon">🎁</span>
        <span class="label">無料体験セッションに申し込む</span>
        <span class="arrow">›</span>
      </a>

      <!-- ② YouTube -->
      <a href="https://www.youtube.com/@ai-kyoiku-labo" class="link-btn">
        <span class="icon">📺</span>
        <span class="label">最新動画を見る（YouTube）</span>
        <span class="arrow">›</span>
      </a>

      <!-- ③ 解説記事 -->
      <a href="https://ai-native-edu-lp.vercel.app" class="link-btn">
        <span class="icon">📖</span>
        <span class="label">AI教育とは？3分で読める解説</span>
        <span class="arrow">›</span>
      </a>

      <!-- ④ Instagram -->
      <a href="https://www.instagram.com/ai_kyoiku_labo/" class="link-btn">
        <span class="icon">📸</span>
        <span class="label">日々の発信（Instagram）</span>
        <span class="arrow">›</span>
      </a>
    </div>

    <footer>
      © 2026 AI共育ラボ
    </footer>
  </div>
</body>
</html>
